      --border: rgba(255,215,0,0.08);
      --border-hover: rgba(245,200,66,0.25);
      --gold: #f5c842;
      --gold-bg: rgba(245,200,66,0.08);

      --coral: #f87171;
      --coral-bg: rgba(248,113,113,0.08);
      --text: #f0ead8;
      --text-2: #8899b0;
      --text-3: #4a5a72;

    [data-theme="light"] {
      --bg: #f0ece4;
      --bg-card: rgba(255,255,255,0.75);
      --bg-card-hover: rgba(255,255,255,0.9);
      --border: rgba(160,130,20,0.12);
      --border-hover: rgba(245,200,66,0.3);
      --gold: #b8860b;
      --gold-bg: rgba(184,134,11,0.06);
      --text: #1a1a2e;
      --text-2: #4a5568;
      --text-3: #8896aa;
    }
    [data-theme="cyan"] {
      --bg: #061218;
      --bg-card: rgba(8,28,38,0.75);
      --bg-card-hover: rgba(12,36,48,0.85);
      --border: rgba(0,212,180,0.12);
      --border-hover: rgba(0,212,180,0.3);
      --gold: #00d4b4;
      --gold-bg: rgba(0,212,180,0.08);
      --text: #d6f3f0;
      --text-2: #8bc9c0;
      --text-3: #4a8a7e;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body {
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
      padding: 28px;
    }
    .panel { max-width:1200px; margin:0 auto; }
    .panel-head {
      display:flex; align-items:center; justify-content:space-between;

    .panel-head-left { display:flex; align-items:center; gap:14px; }
    .panel-icon {

    .panel-title {

    .panel-subtitle { font-size:0.7rem; color:var(--text-3); letter-spacing:0.3px; margin-top:2px; }
    .panel-badges { display:flex; gap:8px; flex-wrap:wrap; }
    .p-badge {

      letter-spacing:0.5px; border:1px solid var(--border);
      background:rgba(255,255,255,0.02); color:var(--text-2);
      display:flex; align-items:center; gap:6px;
      transition: var(--ease);
    }
    .p-badge i { font-size:0.65rem; }
    .p-badge.b-gold i { color:var(--gold); }
    .p-badge.b-coral i { color:var(--coral); }

      display:flex; align-items:center; gap:10px;
      margin-bottom:20px; flex-wrap:wrap;
    }
    .btn-add {
      padding:10px 22px;
      background:var(--gold);
      color:#0a0e1a;
      border:none;
      border-radius:100px;
      font-weight:700;
      font-size:0.8rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      transition:var(--ease);
      font-family:'Outfit',sans-serif;
      box-shadow:0 4px 18px var(--gold-glow);
    }
    .btn-add:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 28px var(--gold-glow);
    }
    .btn-sync {
      padding:10px 18px;
      background:rgba(255,255,255,0.05);
      border:1px solid var(--border);
      border-radius:100px;
      color:var(--text-2);
      font-weight:600;
      font-size:0.75rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
      transition:var(--ease);
      font-family:'Outfit',sans-serif;
    }
    .btn-sync:hover {
      border-color:var(--border-hover);
      color:var(--text);
      background:var(--gold-bg);
    }

      display:flex;
      flex-direction:column;
      cursor:default;

      box-shadow:0 12px 32px rgba(0,0,0,0.35),0 0 20px rgba(245,200,66,0.05);
      background:var(--bg-card-hover);
    }
    .note-header {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:8px;
      gap:8px;
    }
    .note-title {
      font-weight:700;
      font-size:0.9rem;
      color:var(--text);
      background:transparent;
      border:none;
      outline:none;
      width:100%;
      font-family:'Outfit',sans-serif;
      padding:2px 4px;
      border-radius:4px;
      transition:var(--ease);
      cursor:text;
    }
    .note-title:focus {
      background:rgba(245,200,66,0.06);
      box-shadow:0 0 0 2px var(--gold);
    }

    .note-body {
      font-size:0.78rem;
      color:var(--text-2);
      background:transparent;
      border:none;
      outline:none;
      resize:vertical;
      width:100%;
      min-height:80px;
      max-height:300px;
      font-family:'Outfit',sans-serif;
      padding:4px 4px;
      border-radius:4px;
      transition:var(--ease);
      line-height:1.6;
      flex:1;
      scrollbar-width:thin;
    }

      box-shadow:0 0 0 2px var(--gold);

      border:none;
      color:var(--text-3);
      cursor:pointer;
      font-size:0.75rem;
      padding:4px 6px;
      border-radius:4px;
      transition:var(--ease);

      color:var(--text-3);

    }
    .empty-state p {
      font-size:0.85rem;

      backdrop-filter:blur(30px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2000;
      padding:20px;
      opacity:0;
      visibility:hidden;

    .modal-overlay.active {

      visibility:visible;

      position:relative;
      display:flex;
      flex-direction:column;
    }
    .modal-overlay.active .modal-box {
      transform:scale(1) translateY(0);
    }
    .modal-box::before {
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);

    .modal-header {
      display:flex;
      align-items:center;
      justify-content:space-between;

      border-bottom:1px solid var(--border);
      flex-shrink:0;

    .modal-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:1.2rem;

      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      padding-right:14px;
    }
    .modal-close {
      width:36px;
      height:36px;
      border-radius:var(--r-sm);
      border:1px solid var(--border);
      background:transparent;
      color:var(--text-3);
      font-size:0.9rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;

    @media(max-width:640px){

      .panel-head{flex-direction:column;align-items:flex-start;}

  </style>
</head>

  // ============================================================
  // 5. FUNGSI UTAMA
  // ============================================================
  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          notes = parsed;
          return;
        }
      }
    } catch(e) {}
    notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function saveNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    render();
    if (isSupabaseReady && syncEnabled) {
      syncToSupabase();
    }
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const isThisYear = d.getFullYear() === now.getFullYear();
    const time = d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    if (isToday) return `Hari ini, ${time}`;
    if (isThisYear) {
      return d.toLocaleDateString('id-ID', {day:'numeric', month:'short'}) + `, ${time}`;
    }
    return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) + `, ${time}`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function render() {
    const sorted = [...notes].sort((a,b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return b.updatedAt - a.updatedAt;
    });

    countBadge.textContent = notes.length;
    pinnedBadge.textContent = notes.filter(n => n.pinned).length;

    if (notes.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-sticky-note"></i>
          <p>Belum ada catatan. Klik <strong>"Tambah Catatan"</strong> untuk mulai menulis.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = sorted.map(note => `
      <div class="note-card ${note.pinned ? 'pinned' : ''}" data-id="${note.id}">
        <div class="note-header">
          <input class="note-title" type="text" value="${escapeHtml(note.title)}" placeholder="Judul catatan..." data-field="title">
          <button class="btn-pin" data-action="pin" title="${note.pinned ? 'Lepas pin' : 'Sematkan'}">
            <i class="fas fa-thumbtack" style="${note.pinned ? 'color:var(--gold);transform:rotate(-45deg);' : 'opacity:0.4;'}"></i>
          </button>
        </div>
        <textarea class="note-body" placeholder="Tulis catatan di sini..." data-field="body">${escapeHtml(note.body)}</textarea>
        <div class="note-footer">
          <span class="note-date"><i class="far fa-clock"></i> ${formatDate(note.updatedAt)}</span>
          <div class="note-actions">
            <button class="btn-expand" data-action="expand" title="Lihat lengkap"><i class="fas fa-expand"></i></button>
            <button data-action="delete" title="Hapus catatan"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.note-card').forEach(card => {
      const id = card.dataset.id;

      const titleInput = card.querySelector('.note-title');
      titleInput.addEventListener('blur', function() {
        updateNoteField(id, 'title', this.value);
      });
      titleInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') this.blur();
      });

      const bodyTextarea = card.querySelector('.note-body');
      bodyTextarea.addEventListener('input', function() {
        autoResize(this);
        clearTimeout(this._saveTimer);
        this._saveTimer = setTimeout(() => {
          updateNoteField(id, 'body', this.value);
        }, 300);
      });
      bodyTextarea.addEventListener('blur', function() {
        clearTimeout(this._saveTimer);
        updateNoteField(id, 'body', this.value);
      });
      setTimeout(() => autoResize(bodyTextarea), 10);

      const pinBtn = card.querySelector('[data-action="pin"]');
      pinBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePin(id);
      });

      const delBtn = card.querySelector('[data-action="delete"]');
      delBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteNote(id);
      });

      const expandBtn = card.querySelector('[data-action="expand"]');
      expandBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        openModal(id);
      });

      card.addEventListener('dblclick', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        openModal(id);
      });
    });
  }

  function updateNoteField(id, field, value) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    note[field] = value;
    note.updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    countBadge.textContent = notes.length;
    pinnedBadge.textContent = notes.filter(n => n.pinned).length;
    const card = document.querySelector(`.note-card[data-id="${id}"]`);
    if (card) {
      const dateEl = card.querySelector('.note-date');
      if (dateEl) dateEl.innerHTML = `<i class="far fa-clock"></i> ${formatDate(note.updatedAt)}`;
    }
    if (isSupabaseReady && syncEnabled) {
      syncToSupabase();
    }
  }

  function togglePin(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    note.pinned = !note.pinned;
    note.updatedAt = Date.now();
    saveNotes();
    toast(note.pinned ? 'Catatan disematkan' : 'Pin dilepas');
  }

  function deleteNote(id) {
    if (!confirm('Hapus catatan ini?')) return;
    notes = notes.filter(n => n.id !== id);
    saveNotes();
    toast('Catatan dihapus');
  }

  function addNote() {
    const now = Date.now();
    const newNote = {
      id: genId(),
      title: 'Catatan baru',
      body: 'Tulis sesuatu di sini...',
      pinned: false,
      createdAt: now,
      updatedAt: now
    };
    notes.unshift(newNote);
    saveNotes();
    toast('Catatan baru ditambahkan');

    setTimeout(() => {
      const firstCard = grid.querySelector('.note-card');
      if (firstCard) {
        const titleInput = firstCard.querySelector('.note-title');
        if (titleInput) {
          titleInput.focus();
          titleInput.select();
        }
      }
    }, 50);
  }

  // ============================================================
  // 6. FUNGSI SUPABASE
  // ============================================================
  async function syncToSupabase() {
    if (!isSupabaseReady || isSyncing) return;
    isSyncing = true;
    const syncBtn = $('btnSync');
    syncBtn.classList.add('syncing');
    syncStatusText.textContent = 'Menyimpan...';
    
    try {
      const notesToSync = notes.map(n => ({
        id: n.id,
        title: n.title,
        body: n.body,
        pinned: n.pinned,
        created_at: new Date(n.createdAt).toISOString(),
        updated_at: new Date(n.updatedAt).toISOString()
      }));
      
      const { error } = await supabase
        .from(TABLE_NAME)
        .upsert(notesToSync, { onConflict: 'id' });
      
      if (error) throw error;
      
      localStorage.setItem(SYNC_KEY, 'true');
      syncStatusText.textContent = 'Tersimpan';
      syncBtn.classList.remove('syncing');
      toast('Catatan tersimpan ke cloud');
    } catch (error) {
      console.error('Sync error:', error);
      syncStatusText.textContent = 'Gagal sync';
      syncBtn.classList.remove('syncing');
      toast('Gagal sync: ' + error.message);
    } finally {
      isSyncing = false;
    }
  }

  async function loadFromSupabase() {
    if (!isSupabaseReady) {
      toast('Supabase tidak terhubung, gunakan mode offline');
      return;
    }
    
    isSyncing = true;
    const syncBtn = $('btnSync');
    syncBtn.classList.add('syncing');
    syncStatusText.textContent = 'Memuat...';
    
    try {
      const { data, error } = await supabase
        .from(TABLE_NAME)
        .select('*')
        .order('updated_at', { ascending: false });
      
      if (error) throw error;
      
      if (data && data.length > 0) {
        notes = data.map(item => ({
          id: item.id,
          title: item.title || 'Tanpa Judul',
          body: item.body || '',
          pinned: item.pinned || false,
          createdAt: new Date(item.created_at).getTime(),
          updatedAt: new Date(item.updated_at).getTime()
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        localStorage.setItem(SYNC_KEY, 'true');
        syncStatusText.textContent = 'Terkoneksi';
        render();
        toast(`Berhasil memuat ${notes.length} catatan dari cloud`);
      } else {
        syncStatusText.textContent = 'Upload data...';
        await syncToSupabase();
        toast('Data lokal diupload ke cloud');
      }
    } catch (error) {
      console.error('Load from Supabase error:', error);
      syncStatusText.textContent = 'Gagal load';
      toast('Gagal memuat dari cloud: ' + error.message);
      loadNotes();
      render();
    } finally {
      isSyncing = false;
      syncBtn.classList.remove('syncing');
    }
  }

  // ============================================================
  // 7. MODAL FUNGSI
  // ============================================================
  function openModal(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    modalTitle.textContent = note.title || 'Tanpa Judul';
    modalContent.textContent = note.body || '(Kosong)';
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  function copyModalContent() {
    const text = modalContent.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      toast('Isi catatan disalin ke clipboard');
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      toast('Isi catatan disalin ke clipboard');
    });
  }

  // ============================================================
  // 8. TOAST
  // ============================================================
  function toast(msg, sub='') {
    $('tMsg').textContent = msg;
    $('tSub').textContent = sub || '';
    const t = $('toast');
    t.classList.add('on');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('on'), 2500);
  }

  // ============================================================
  // 9. CLOCK
  // ============================================================
  function updateClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  }

  // ============================================================
  // 10. INISIALISASI
  // ============================================================
  modalClose.addEventListener('click', closeModal);
  modalCloseBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
  modalCopy.addEventListener('click', copyModalContent);

  $('btnAddNote').addEventListener('click', addNote);
  $('btnSync').addEventListener('click', loadFromSupabase);

  const hasSynced = localStorage.getItem(SYNC_KEY) === 'true';
  
  loadNotes();
  render();
  updateClock();
  setInterval(updateClock, 10000);

  if (isSupabaseReady) {
    syncEnabled = true;
    storageLabel.textContent = 'Cloud';
    syncStatusText.textContent = 'Terkoneksi';
    
    if (hasSynced) {
      setTimeout(loadFromSupabase, 500);
    } else {
      setTimeout(() => {
        syncToSupabase();
      }, 1000);
    }
  } else {
    storageLabel.textContent = 'Lokal';
    syncStatusText.textContent = 'Offline';
  }

  // ============================================================
  // 11. THEME SYNC
  // ============================================================
  (function syncTheme() {
    const valid = ['dark','light','cyan'];
    const saved = localStorage.getItem('cs-theme');
    if (saved && valid.includes(saved)) document.documentElement.setAttribute('data-theme', saved);
    else document.documentElement.setAttribute('data-theme','dark');
    window.addEventListener('storage', e => {
      if (e.key === 'cs-theme' && valid.includes(e.newValue)) {
        document.documentElement.setAttribute('data-theme', e.newValue);
      }
    });
    window.addEventListener('message', e => {
      if (e.data?.type === 'themeChange' && valid.includes(e.data.theme)) {
        document.documentElement.setAttribute('data-theme', e.data.theme);
      }
    });
  })();

  console.log('✅ Aplikasi catatan siap!');
  console.log(`📝 ${notes.length} catatan dimuat`);
  console.log(`🔗 Supabase: ${isSupabaseReady ? 'Terkoneksi' : 'Offline'}`);

})();
</script>
